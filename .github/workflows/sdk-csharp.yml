name: SDK (C#)

on:
  pull_request:
    paths: &paths
      - "sdks/csharp/**"
      - "fixtures/**"
      - "docs/sdk-contract.md"
      - "docs/sdk-test-service.md"
      - "packages/sdk-conformance/**"
      - ".github/workflows/sdk-csharp.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: sdk-csharp-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sdk:
    name: C# SDK (lint, test, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The toolchain step: the .NET SDK at the version sdks/csharp/global.json pins (10.0.404, the newest LTS),
      # which is also what sdks/csharp/mise.toml names. setup-dotnet reads the one file, so the two cannot drift here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: sdks/csharp/global.json
      - run: bun install --frozen-lockfile
      - run: sdks/csharp/bin/lint
      - run: sdks/csharp/bin/test
      - run: bun run conformance -- --service sdks/csharp/bin/test-service
