name: SDK (C#)

on:
  pull_request:
    paths: &paths
      - "sdks/csharp/**"
      - "fixtures/**"
      - "docs/sdk-contract.md"
      - "docs/sdk-test-service.md"
      - "packages/sdk-conformance/**"
      - ".github/workflows/sdk-csharp.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: sdk-csharp-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sdk:
    name: C# SDK (lint, test, conformance)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The toolchain step: the .NET SDK at the version sdks/csharp/mise.toml pins (global.json pins the same
      # one). Limited to that one tool, so the root .tool-versions (a second .NET, a second Bun) is not installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: sdks/csharp
          install_args: dotnet
      - run: bun install --frozen-lockfile
      - run: sdks/csharp/bin/lint
      - run: sdks/csharp/bin/test
      - run: bun run conformance -- --service sdks/csharp/bin/test-service
