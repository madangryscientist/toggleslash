name: CI

# The gate from AGENTS.md. The trigger is `pull_request` (never `pull_request_target`). Actions are
# pinned to a commit; the tag is in the comment.
#
# The only secrets read are the moon remote cache's tokens (.moon/workspace.yml `remote:`), and only
# on the steps that run moon, so `bun install` and the third-party actions never see one. moon passes
# its environment on, so the tasks it runs (our code and its dependencies, pinned by bun.lock) do:
# - MOON_CACHE_READ_TOKEN, a repository secret: may read the cache, and its uploads are refused.
# - MOON_CACHE_WRITE_TOKEN: lives only in the `moon-cache-write` environment, which GitHub lets only
#   `main` use. Only the `checks`, `apps`, `e2e` and `stack` jobs on a push to main enter it, so only
#   main writes the cache, and a pull request cannot poison it. A tag push (release.yml calling this
#   workflow) is a push too, so each guard also names `refs/heads/main`. Never make it a plain
#   repository secret: a same-repo pull request can read those.
# A pull request from a fork, or from Dependabot, gets no Actions secrets: the token is empty, the
# cache refuses it, and the run is cold and green.
#
# Runs on GitHub-hosted `ubuntu-latest`. A pull request from a fork runs with a read-only token.
# Never add `pull_request_target`, `workflow_run` or a comment trigger here; scripts/check-workflows.ts,
# run by `checks`, refuses them, and any runner of our own.
#
# release.yml reuses this workflow through `workflow_call`, so the release gate is this workflow and
# never a copy of it. In a called workflow `github.event_name` and `github.ref` are the caller's (a
# `push` of `refs/tags/v*`), so every job but `checks` and `gate` carries
# `if: github.ref_type != 'tag'`: a tag is cut from main, where they already ran.
#
# Check names are the job ids (no `name:` on a job). Branch protection requires one check, `gate`, the
# last job: it waits for `checks` (typecheck, lint, format, parity, test), `changes`, `apps` (web
# build, deploy dry run and web e2e), `e2e` (cross-language), `stack` (browser journey) and
# `container` (self-hosting), and fails when any of them failed or was cancelled. A skipped job
# passes: `apps` skips when nothing it covers changed, and on a tag every job it waits for but
# `checks` skips.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its run; a push to main never cancels the run before
  # it, which may be writing the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A push to main enters the environment that holds the cache's write token; anything else enters
    # none. See the header.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    env:
      # moon 2.6.5 diffs the head against the base branch before any task runs, even for a plain
      # `moon run`, and the checkout has no local `main`, so it names the remote ref. That needs the
      # full history (fetch-depth: 0 below). No switch skips the diff short of --force, which would
      # also bypass the cache.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # global.json pins the SDK; apps/server is part of the gate (the `server` moon project runs dotnet).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # No workflow names a runner of our own or a trigger a fork can drive.
      - run: bun scripts/check-workflows.ts .github/workflows/*.yml
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run lint
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run format:check
      - run: bun run parity:check
      - run: bun run parity:check:commits
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run test
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}

  changes:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The apps and packages (what they import), plus what decides how they install and run.
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(apps/web/|packages/|\.moon/|bun\.lock$|bunfig\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  apps:
    needs: changes
    if: github.ref_type != 'tag' && needs.changes.outputs.apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Writes the cache on a push to main, like the checks job; see the header.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    env:
      # The web tasks do not touch apps/server (the checks job covers it), and moon's graph
      # needs no SDK, so none is installed here. MOON_BASE and the full history: see the checks job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # wrangler (the web server of the e2e run, and the dry run) needs Node 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install chromium-headless-shell
      # The build and its dry run go before web:test-e2e, which leaves its own e2e build in dist and
      # .wrangler/deploy: a web:build cache hit leaves outputs that are there as they are, so after
      # the e2e run the dry run would check the e2e build.
      - run: bunx moon run web:build
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}
      - name: Web deploy dry run
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fs-web-dry"
      - run: bunx moon run web:test-e2e
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}

  # Cross-language proof (FS-23): the real server, CLI and SDK on loopback. CI is set, so a missing
  # .NET SDK fails the job instead of skipping it.
  e2e:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Writes the cache on a push to main, like the checks job; see the header.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    env:
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: bun install --frozen-lockfile
      # Through scripts/moon.ts, which sets TOGGLESLASH_DOTNET, an input of the task.
      - run: bun scripts/moon.ts run e2e:test-e2e
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}

  # Browser journey (FS-46): the dashboard in a browser, two shoppers on the example app and the
  # CLI, against the real server. It runs on every PR, and CI is set, so a missing .NET SDK fails
  # the job. Its secrets are made per run and live in memory; no report or trace is uploaded,
  # because one could hold the sign-in password, the admin token or a scoped token.
  stack:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Writes the cache on a push to main, like the checks job; see the header.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'moon-cache-write' || '' }}
    env:
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The stack serves the dashboard through vite and wrangler, which need Node 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: packages/e2e
        run: bunx playwright install chromium-headless-shell
      # Through scripts/moon.ts, which sets TOGGLESLASH_DOTNET, an input of the task.
      - run: bun scripts/moon.ts run e2e:test-stack
        env:
          MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MOON_CACHE_WRITE_TOKEN || secrets.MOON_CACHE_READ_TOKEN }}

  # Self-hosting proof (FS-22): the server's image builds and the compose stack answers /health.
  # Nothing is pushed and there is no registry login; the token is a throwaway for this job's
  # container, not a repository secret.
  container:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOGGLESLASH_ADMIN_TOKEN: ci-throwaway-token-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build -f apps/server/Dockerfile -t toggleslash-server:local .
      - name: Start the compose stack and wait for the image's health check
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: /health answers ok
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/health)
          echo "$body"
          case "$body" in *'"status":"ok"'*) ;; *) echo "/health is not ok" >&2; exit 1 ;; esac
      - name: Not root, and the admin token is enforced
        run: |
          uid=$(docker compose exec -T server id -u)
          echo "uid: $uid"
          [ "$uid" != 0 ]
          docker compose exec -T server ls -l /data
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/projects)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOGGLESLASH_ADMIN_TOKEN" http://127.0.0.1:8080/api/v1/projects)" = 200 ]
      - name: Data survives a restart, a backup and a restore (docs/self-hosting.md)
        run: |
          auth="Authorization: Bearer $TOGGLESLASH_ADMIN_TOKEN"
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"key":"ci-proof","name":"CI proof"}' http://127.0.0.1:8080/api/v1/projects
          # Restart keeps the volume.
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 90
          curl -fsS -H "$auth" http://127.0.0.1:8080/api/v1/projects/ci-proof
          # Backup, as the guide says.
          docker compose stop server
          docker compose cp server:/data/. ./toggleslash-backup
          ls -l toggleslash-backup
          # Lose the volume, then restore, as the guide says.
          docker compose down -v
          docker compose run --rm --no-deps --user 0 --entrypoint bash \
            -v "$PWD/toggleslash-backup:/backup:ro" server \
            -c 'cp -a /backup/. /data/ && chown -R 1654 /data'
          docker compose up -d --no-build --wait --wait-timeout 90
          curl -fsS -H "$auth" http://127.0.0.1:8080/api/v1/projects/ci-proof
      - name: Server logs
        if: failure()
        run: docker compose logs server
      - name: Stop the stack and remove its volume
        if: always()
        run: docker compose down -v

  # The one required check. It needs every job above and runs even when one failed (`always()`), so a
  # red job turns it red; a job GitHub skipped by its `if:` is `skipped`, which passes. It checks out
  # nothing and reads no secret.
  gate:
    needs: [checks, changes, apps, e2e, stack, container]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "a needed job failed or was cancelled" >&2
            exit 1
          fi
