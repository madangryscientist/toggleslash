name: CI

# The gate from AGENTS.md. No secrets are read, and the trigger is `pull_request` (never
# `pull_request_target`). Actions are pinned to a commit; the tag is in the comment.
#
# Runs on the self-hosted `proxmox` runner (FS-116), set up by omnibus (ops/proxmox/gh-runner/). The
# runner is for the owner's own commits only: every job's `if:` lets a push through, or a pull request
# whose head branch lives in this repo. A fork's pull request carries its own copy of this file, so
# the `if:` alone cannot stop a fork: the barrier is the repo setting register.sh applies. Never add
# `pull_request_target`, `workflow_run`, `workflow_dispatch`, `workflow_call` or a comment trigger
# here; scripts/check-workflows.ts, run by `gate`, refuses them. release.yml keeps its own copy of the
# `gate` job on a hosted runner.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Bun the repo is built and pinned against (.tool-versions).
  BUN_VERSION: "1.4.2"

jobs:
  gate:
    name: Gate (typecheck, lint, format, parity, test)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # global.json pins the SDK; apps/server is part of the gate. The @nx/dotnet plugin needs it for every nx command.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # The default, /usr/share/dotnet, is not writable by the runner user.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
      # Every workflow that can reach the runner keeps the same-repo guard and the allowed triggers.
      - run: bun scripts/check-workflows.ts .github/workflows/*.yml
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run parity:check
      - run: bun run parity:check:commits
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run test

  changes:
    name: Did an app change?
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The apps and packages (what they import), plus what decides how they install and run.
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(apps/(web|site)/|packages/|bun\.lock$|bunfig\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

  apps:
    name: Apps gate (build, e2e, deploy dry run)
    needs: changes
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.apps == 'true'
    runs-on: proxmox
    timeout-minutes: 30
    env:
      # The web and site checks do not touch apps/server (the gate job covers it), so no SDK here.
      NX_DOTNET_DISABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # wrangler (the web server of the e2e run, and the dry runs) needs Node 22; the runner has 20.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install chromium-headless-shell
      - run: bunx nx test:e2e web
      - run: bunx nx build web
      - name: Web deploy dry run
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fs-web-dry"
      - run: bunx nx build site
      - run: bunx nx test:e2e site
      - name: Site deploy dry run
        working-directory: apps/site
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/fs-site-dry"

  # Cross-language proof (FS-23): the real server, CLI and SDK on loopback. CI is set, so a missing
  # .NET SDK fails the job instead of skipping it.
  e2e:
    name: End to end (server, CLI, SDK)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # The default, /usr/share/dotnet, is not writable by the runner user.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
      - run: bun install --frozen-lockfile
      - run: bunx nx run e2e:test:e2e

  # Browser journey (FS-46): the dashboard in a browser, two shoppers on the example app and the
  # CLI, against the real server. It runs on every PR, and CI is set, so a missing .NET SDK fails
  # the job. Its secrets are made per run and live in memory; nothing is uploaded, because a
  # report or a trace could hold the sign-in password, the admin token or a scoped token.
  stack:
    name: Browser journey (dashboard, server, CLI, example)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # The default, /usr/share/dotnet, is not writable by the runner user.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json
      # The stack serves the dashboard through vite and wrangler, which need Node 22; the runner has 20.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: packages/e2e
        run: bunx playwright install chromium-headless-shell
      - run: bunx nx run e2e:test:stack

  # Self-hosting proof (FS-22): the server's image builds and the compose stack answers /health.
  # Nothing is pushed and there is no registry login; the token is a throwaway for this job's
  # container, not a repository secret.
  container:
    name: Container (docker build, compose up, /health)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: proxmox
    timeout-minutes: 20
    env:
      TOGGLESLASH_ADMIN_TOKEN: ci-throwaway-token-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build -f apps/server/Dockerfile -t toggleslash-server:local .
      - name: Start the compose stack and wait for the image's health check
        run: docker compose up -d --no-build --wait --wait-timeout 90
      - name: /health answers ok
        run: |
          body=$(curl -fsS http://127.0.0.1:8080/health)
          echo "$body"
          case "$body" in *'"status":"ok"'*) ;; *) echo "/health is not ok" >&2; exit 1 ;; esac
      - name: Not root, and the admin token is enforced
        run: |
          uid=$(docker compose exec -T server id -u)
          echo "uid: $uid"
          [ "$uid" != 0 ]
          docker compose exec -T server ls -l /data
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/projects)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOGGLESLASH_ADMIN_TOKEN" http://127.0.0.1:8080/api/v1/projects)" = 200 ]
      - name: Data survives a restart, a backup and a restore (docs/self-hosting.md)
        run: |
          auth="Authorization: Bearer $TOGGLESLASH_ADMIN_TOKEN"
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"key":"ci-proof","name":"CI proof"}' http://127.0.0.1:8080/api/v1/projects
          # Restart keeps the volume.
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 90
          curl -fsS -H "$auth" http://127.0.0.1:8080/api/v1/projects/ci-proof
          # Backup, as the guide says.
          docker compose stop server
          docker compose cp server:/data/. ./toggleslash-backup
          ls -l toggleslash-backup
          # Lose the volume, then restore, as the guide says.
          docker compose down -v
          docker compose run --rm --no-deps --user 0 --entrypoint bash \
            -v "$PWD/toggleslash-backup:/backup:ro" server \
            -c 'cp -a /backup/. /data/ && chown -R 1654 /data'
          docker compose up -d --no-build --wait --wait-timeout 90
          curl -fsS -H "$auth" http://127.0.0.1:8080/api/v1/projects/ci-proof
      - name: Server logs
        if: failure()
        run: docker compose logs server
      - name: Stop the stack and remove its volume
        if: always()
        run: docker compose down -v
