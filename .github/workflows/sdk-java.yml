name: SDK (Java)

on:
  pull_request:
    paths: &paths
      - "sdks/java/**"
      - "fixtures/**"
      - "docs/sdk-contract.md"
      - "docs/sdk-test-service.md"
      - "packages/sdk-conformance/**"
      - ".github/workflows/sdk-java.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: sdk-java-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sdk:
    name: Java SDK (lint, test, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The toolchain step: Temurin and Maven at the versions sdks/java/mise.toml pins. bin/lint, bin/test and
      # bin/test-service all run Maven and Java through `mise exec`, so mise is what must be on PATH. Limited to
      # those two tools, so the root .tool-versions (.NET, a second Bun) is not installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: sdks/java
          install_args: java maven
      - run: bun install --frozen-lockfile
      - run: sdks/java/bin/lint
      - run: sdks/java/bin/test
      - run: bun run conformance -- --service sdks/java/bin/test-service
