name: Release

# Publishes the `@hackcove/toggleslash` npm package (packages/cli) when a `v*` tag is pushed: ci.yml's
# gate first (a reusable workflow call, not a copy), then `npm publish --provenance`. There is no NPM_TOKEN
# anywhere: npm trusted publishing (OIDC) lets this workflow publish with a short-lived token that
# npm checks against the trusted publisher set on the package's npm settings page (repository,
# workflow file `release.yml`, environment `npm`). That page, the `npm` environment and the tag are
# the maintainer's steps; nothing here runs until a tag is pushed. Actions are pinned to a commit;
# the tag is in the comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ci.yml itself, called rather than copied, so the release gate cannot drift from it. Its `checks`
  # job runs the gate and its last job, `gate`, waits for it.
  # In the called workflow the event is this tag push: ci.yml's guards keep its cache-write
  # environment and token to `refs/heads/main` and skip every job but `checks` and `gate` on a tag
  # (a tag is cut from `main`, where they already ran). Its moon steps read the remote cache with the
  # read token, a repository secret passed on by `secrets: inherit`. The check shows as `gate / gate`.
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm trusted publishing and the provenance statement are signed with.
      id-token: write
    env:
      # moon diffs the head against the base branch before any task runs; see ci.yml's checks job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match packages/cli version $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # The package is TypeScript only: moon's graph needs no SDK, and `cli:build` does not touch apps/server.
      # Always a fresh build, never a cache hit, in case the cache was poisoned: what npm publishes with
      # provenance is built from this tag on this runner. `--force` skips every cache, and there is no
      # cache token here either.
      - run: bunx moon run cli:build --force
      - name: Ship the licence files
        run: cp LICENSE NOTICE packages/cli/
      - name: Publish
        run: npm publish ./packages/cli --provenance --access public
