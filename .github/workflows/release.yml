name: Release

# Publishes the `@hackcove/toggleslash` npm package (packages/cli) when a `v*` tag is pushed: the
# gate first, then `npm publish --provenance`. There is no NPM_TOKEN
# anywhere: npm trusted publishing (OIDC) lets this workflow publish with a short-lived token that
# npm checks against the trusted publisher set on the package's npm settings page (repository,
# workflow file `release.yml`, environment `npm`). That page, the `npm` environment and the tag are
# the maintainer's steps; nothing here runs until a tag is pushed. Actions are pinned to a commit;
# the tag is in the comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A copy of ci.yml's `gate` job (keep the two in step), not a call to it: ci.yml has no `workflow_call`
  # trigger and runs on push and pull_request only. Both run on GitHub-hosted runners. It leaves out
  # ci.yml's `apps`, `e2e`, `stack` and `container` jobs on purpose: a tag is cut from `main`, where
  # ci.yml already ran them. Its moon steps read the remote cache with the read token only (main's
  # ci.yml gate is the only writer), so a tag's run is mostly cache hits. `publish` does not read it.
  gate:
    name: Gate (typecheck, lint, format, parity, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # moon diffs the head against the base branch before any task runs; see ci.yml's gate job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      # global.json pins the SDK; apps/server is part of the gate (the `server` moon project runs dotnet).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run lint
        env:
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}
      - run: bun run format:check
      - run: bun run parity:check
      - run: bun run parity:check:commits
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run test
        env:
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_CACHE_READ_TOKEN }}

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm trusted publishing and the provenance statement are signed with.
      id-token: write
    env:
      # moon diffs the head against the base branch before any task runs; see ci.yml's gate job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match packages/cli version $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # The package is TypeScript only: moon's graph needs no SDK, and `cli:build` does not touch apps/server.
      # No cache token here on purpose: what npm publishes with provenance is built from this tag on this
      # runner, never restored from the remote cache.
      - run: bunx moon run cli:build
      - name: Ship the licence files
        run: cp LICENSE NOTICE packages/cli/
      - name: Publish
        run: npm publish ./packages/cli --provenance --access public
