name: Release

# Publishes the six ToggleSlash npm packages when a `v*` tag is pushed: `@slashsuite/toggleslash` (the CLI,
# packages/cli), `@slashsuite/toggleslash-engine`, `@slashsuite/toggleslash-sdk`, `@slashsuite/toggleslash-sdk-browser`,
# `@slashsuite/toggleslash-sdk-otel` and `@slashsuite/toggleslash-sdk-openfeature`, all at the tag's version. ci.yml's
# gate runs first (a reusable workflow call, not a copy), then `bun scripts/pack.ts` builds and packs the six.
#
# Each package takes one of two paths, decided by asking npm whether it has the package:
# - npm has it (any version but the `0.0.0-stage` placeholder below): `npm publish --provenance` through npm trusted
#   publishing (OIDC), with a short-lived token npm checks against the trusted publisher set on the package's npm
#   settings page (repository, workflow file `release.yml`, environment `npm`). No token is in that step.
# - npm does not have it: a trusted publisher can only be set on a package that exists, so its first version is
#   staged instead (`npm stage publish`, npm 11.15.0 or newer) with `NPM_TOKEN`, a granular token on the `npm`
#   environment that does not bypass 2FA. Staging a new package makes npm publish a public `0.0.0-stage`
#   placeholder; the staged version itself stays private until the maintainer approves it with 2FA under Staged
#   Packages on npmjs.com. The maintainer then sets the package's trusted publisher, and every later tag publishes
#   it through OIDC. A package that depends on one being staged in the same run is staged too, so nothing public
#   names a version that still waits for approval.
# The `npm` environment, its secret, the approvals, the trusted publishers and the tag are the maintainer's steps;
# nothing here runs until a tag is pushed. Actions are pinned to a commit; the tag is in the comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ci.yml itself, called rather than copied, so the release gate cannot drift from it. Its `checks`
  # job runs the gate and its last job, `gate`, waits for it.
  # In the called workflow the event is this tag push: ci.yml's guards keep its cache-write
  # environment and token to `refs/heads/main` and skip every job but `checks` and `gate` on a tag
  # (a tag is cut from `main`, where they already ran). Its moon steps read the remote cache with the
  # read token, a repository secret passed on by `secrets: inherit`. The check shows as `gate / gate`.
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm trusted publishing and the provenance statement are signed with.
      id-token: write
    env:
      # moon diffs the head against the base branch before any task runs; see ci.yml's checks job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The tag is every package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for package in engine sdk sdk-browser sdk-otel sdk-openfeature cli; do
            version="$(node -p "require('./packages/$package/package.json').version")"
            if [ "$TAG" != "v$version" ]; then
              echo "tag $TAG does not match packages/$package version $version" >&2
              exit 1
            fi
          done
      - run: bun install --frozen-lockfile
      # The packages are TypeScript only: moon's graph needs no SDK, and neither `tsc` nor `cli:build` touches
      # apps/server. pack.ts always builds fresh: each library's `tsc` emit, and `cli:build --force`, never a cache
      # hit, in case the cache was poisoned: what npm publishes with provenance is built from this tag on this
      # runner. There is no cache token here either.
      - name: Build and pack
        run: bun scripts/pack.ts --out "$RUNNER_TEMP/pack"
      # Staging needs npm 11.15.0 or newer; Node 24 may ship an older 11.x. Pinned, so the release runs a known npm.
      - name: npm for staged publishing
        run: npm install --global npm@11.15.0
      # Which packages go which way, in dependency order (each package after the packages it depends on). A package
      # is staged when npm does not have it (no versions, or only the `0.0.0-stage` placeholder of a first version
      # staged and not yet approved: it has no trusted publisher yet), and so is every package that depends on a
      # staged one, so nothing public ever names a version that is still waiting for approval. The rest publish
      # through OIDC.
      - name: Which packages npm has
        id: packages
        run: |
          published=""
          staged=""
          for name in toggleslash-engine toggleslash-sdk toggleslash-sdk-browser toggleslash-sdk-otel toggleslash-sdk-openfeature toggleslash; do
            if out="$(npm view "@slashsuite/$name" versions --json 2>"$RUNNER_TEMP/npm-view.err")"; then
              kind="$(node -e 'const v = [].concat(JSON.parse(process.argv[1])); console.log(v.some((x) => x !== "0.0.0-stage") ? "on-npm" : "placeholder")' "$out")" || {
                echo "::error::Could not read npm's versions of @slashsuite/$name: $out"
                exit 1
              }
            elif grep -q E404 <<<"$out"; then
              kind="new"
            else
              echo "::error::Could not ask npm whether @slashsuite/$name exists: $out $(cat "$RUNNER_TEMP/npm-view.err")"
              exit 1
            fi
            dir="${name#toggleslash-}"
            if [ "$name" = toggleslash ]; then dir=cli; fi
            for dependency in $(node -p 'Object.keys(require(process.argv[1]).dependencies ?? {}).filter((d) => d.startsWith("@slashsuite/toggleslash")).map((d) => d.slice("@slashsuite/".length)).join(" ")' "./packages/$dir/package.json"); do
              if [[ " $staged " == *" $dependency "* ]]; then kind="depends on a staged package"; fi
            done
            if [ "$kind" = on-npm ]; then
              published="$published $name"
            else
              staged="$staged $name"
              echo "@slashsuite/$name is staged: $kind"
            fi
          done
          echo "published=${published# }" >> "$GITHUB_OUTPUT"
          echo "staged=${staged# }" >> "$GITHUB_OUTPUT"
          echo "through OIDC:${published:- none}; staged:${staged:- none}"
      # Packages npm has, through OIDC. No token is in this step's environment. They go before the staged ones, which
      # may depend on them (never the other way round). A version npm already has is skipped, so a rerun after a
      # publish that stopped partway sends the rest instead of failing on the first.
      - name: Publish (trusted publishing)
        if: steps.packages.outputs.published != ''
        env:
          PUBLISHED: ${{ steps.packages.outputs.published }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for name in $PUBLISHED; do
            if [ "$(npm view "@slashsuite/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@slashsuite/$name@$version is already on npm; skipped"
              continue
            fi
            npm publish "$RUNNER_TEMP/pack/slashsuite-$name-$version.tgz" --provenance --access public
          done
      # Staged for the maintainer's approval, in dependency order. This is the only step that sees NPM_TOKEN; it is
      # written to a private userconfig outside the checkout that the step removes on exit. npm refuses to stage a
      # version that is already staged, so a version staged by an earlier run and still waiting (any status but
      # rejected) is skipped: a rerun leaves it for approval instead of failing.
      - name: Stage (NPM_TOKEN)
        if: steps.packages.outputs.staged != ''
        env:
          STAGED: ${{ steps.packages.outputs.staged }}
          TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::@slashsuite/{${STAGED// /,}} are to be staged, which needs the NPM_TOKEN secret on the npm environment."
            exit 1
          fi
          version="${TAG#v}"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/stage.npmrc"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          (umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG")
          for name in $STAGED; do
            if [ "$(npm view "@slashsuite/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@slashsuite/$name@$version is already on npm; skipped"
              continue
            fi
            waiting="$(npm stage list "@slashsuite/$name" --json)"
            already="$(node -e 'const v = process.argv[2]; console.log(JSON.parse(process.argv[1]).some((i) => i.version === v && !/reject/i.test(String(i.status))))' "$waiting" "$version")" || {
              echo "::error::Could not read the staged versions of @slashsuite/$name: $waiting"
              exit 1
            }
            if [ "$already" = true ]; then
              echo "@slashsuite/$name@$version is already staged and waits for approval on npmjs.com; skipped"
              continue
            fi
            npm stage publish "$RUNNER_TEMP/pack/slashsuite-$name-$version.tgz" --provenance --access public
          done
          echo "Staged versions wait for the maintainer's 2FA approval under Staged Packages on npmjs.com."
