name: Release

# Publishes the six ToggleSlash npm packages when a `v*` tag is pushed: `@hackcove/toggleslash` (the CLI,
# packages/cli), `@hackcove/toggleslash-engine`, `@hackcove/toggleslash-sdk`, `@hackcove/toggleslash-sdk-browser`,
# `@hackcove/toggleslash-sdk-otel` and `@hackcove/toggleslash-sdk-openfeature`, all at the tag's version. ci.yml's
# gate runs first (a reusable workflow call, not a copy), then `bun scripts/pack.ts` builds and packs the six, and
# `npm publish --provenance` sends each tarball, in dependency order. There is no NPM_TOKEN anywhere: npm trusted
# publishing (OIDC) lets this workflow publish with a short-lived token that npm checks against the trusted
# publisher set on each package's npm settings page (repository, workflow file `release.yml`, environment `npm`).
# A trusted publisher can only be set on a package that exists, so the first version of each package is published
# by the maintainer by hand. Those pages, the `npm` environment and the tag are the maintainer's steps; nothing here
# runs until a tag is pushed. Actions are pinned to a commit; the tag is in the comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ci.yml itself, called rather than copied, so the release gate cannot drift from it. Its `checks`
  # job runs the gate and its last job, `gate`, waits for it.
  # In the called workflow the event is this tag push: ci.yml's guards keep its cache-write
  # environment and token to `refs/heads/main` and skip every job but `checks` and `gate` on a tag
  # (a tag is cut from `main`, where they already ran). Its moon steps read the remote cache with the
  # read token, a repository secret passed on by `secrets: inherit`. The check shows as `gate / gate`.
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm trusted publishing and the provenance statement are signed with.
      id-token: write
    env:
      # moon diffs the head against the base branch before any task runs; see ci.yml's checks job.
      MOON_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: The tag is every package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for package in engine sdk sdk-browser sdk-otel sdk-openfeature cli; do
            version="$(node -p "require('./packages/$package/package.json').version")"
            if [ "$TAG" != "v$version" ]; then
              echo "tag $TAG does not match packages/$package version $version" >&2
              exit 1
            fi
          done
      - run: bun install --frozen-lockfile
      # The packages are TypeScript only: moon's graph needs no SDK, and neither `tsc` nor `cli:build` touches
      # apps/server. pack.ts always builds fresh: each library's `tsc` emit, and `cli:build --force`, never a cache
      # hit, in case the cache was poisoned: what npm publishes with provenance is built from this tag on this
      # runner. There is no cache token here either.
      - name: Build and pack
        run: bun scripts/pack.ts --out "$RUNNER_TEMP/pack"
      # Dependency order: each package after the packages it depends on, so a later one never names a version
      # npm does not have yet. A version npm already has is skipped, so a rerun after a publish that stopped
      # partway sends the rest instead of failing on the first.
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for name in toggleslash-engine toggleslash-sdk toggleslash-sdk-browser toggleslash-sdk-otel toggleslash-sdk-openfeature toggleslash; do
            if [ "$(npm view "@hackcove/$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@hackcove/$name@$version is already on npm; skipped"
              continue
            fi
            npm publish "$RUNNER_TEMP/pack/hackcove-$name-$version.tgz" --provenance --access public
          done
