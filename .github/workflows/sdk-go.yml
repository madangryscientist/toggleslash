name: SDK (Go)

on:
  pull_request:
    paths: &paths
      - "sdks/go/**"
      - "fixtures/**"
      - "docs/sdk-contract.md"
      - "docs/sdk-test-service.md"
      - "packages/sdk-conformance/**"
      - ".github/workflows/sdk-go.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: sdk-go-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sdk:
    name: Go SDK (lint, test, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The toolchain step: the versions sdks/go/mise.toml pins (Go, golangci-lint and zig). One file names
      # the versions, so the workflow and a developer's machine cannot disagree; the official setup-go
      # would repeat the Go version here. Limited to those tools, so the root .tool-versions (.NET, a
      # second Bun) is not installed. zig is only the C compiler bin/test falls back to for -race, which
      # needs cgo; ubuntu-latest has gcc already.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: sdks/go
          install_args: go golangci-lint zig
      - run: bun install --frozen-lockfile
      - run: sdks/go/bin/lint
      - run: sdks/go/bin/test
      - run: bun run conformance -- --service sdks/go/bin/test-service
