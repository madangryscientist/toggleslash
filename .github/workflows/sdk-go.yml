name: SDK (Go)

on:
  pull_request:
    paths: &paths
      - "sdks/go/**"
      - "fixtures/**"
      - "docs/sdk-contract.md"
      - "docs/sdk-test-service.md"
      - "packages/sdk-conformance/**"
      - ".github/workflows/sdk-go.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: sdk-go-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sdk:
    name: Go SDK (lint, test, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The toolchain step: Go, golangci-lint and zig at the versions sdks/go/mise.toml pins.
      # jdx/mise-action rather than actions/setup-go, because bin/lint calls golangci-lint and
      # bin/test gives cgo zig as its C compiler for -race, so all three tools come from the one
      # file that names their versions. install_args limits it to those three, so the root
      # .tool-versions (.NET, a second Bun) is not installed here.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          working_directory: sdks/go
          install_args: go golangci-lint zig
      - run: bun install --frozen-lockfile
      - run: sdks/go/bin/lint
      - run: sdks/go/bin/test
      - run: bun run conformance -- --service sdks/go/bin/test-service
