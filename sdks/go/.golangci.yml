# The rule set: golangci-lint's "standard" linters (errcheck, govet, ineffassign, staticcheck, unused), plus the
# ones enabled below, and gofmt as the formatter. Tests and the test service are linted too.
version: "2"
run:
  tests: true
linters:
  default: standard
  enable:
    - bodyclose # a response body left open leaks a connection
    - errorlint # compares errors with errors.Is and errors.As, never == or a type assertion
    - gocritic # common mistakes and slow idioms
    - misspell # typos in comments and strings
    - noctx # an HTTP request or a listener without a context cannot be cancelled
    - nolintlint # a //nolint directive must name its linter and carry a reason
    - revive # style and naming
    - unconvert # a conversion to the type a value already has
    - unparam # a parameter or result that is always the same
  settings:
    revive:
      rules:
        # revive's two noisy defaults: the exported-comment form and the package comment on every package.
        # The public API and each package carry doc comments written for a reader, not for a pattern, and the
        # internal packages have a comment on the file that matters.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
formatters:
  enable:
    - gofmt
