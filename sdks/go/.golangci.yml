version: "2"

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused; the rest are named here because they catch
  # what this SDK must not do (a wrong format verb, a lost error, an unconverted type in a comparison).
  default: standard
  enable:
    - errorlint # errors.Is/As, never a direct comparison of an error value
    - misspell # comments and identifiers spelled as English words
    - nilerr # returning nil where an error was found
    - unconvert # a redundant type conversion hides a wrong type
    - unparam # a parameter no caller varies is a design smell in a small SDK
  exclusions:
    paths:
      # The test service's panics are the protocol's 500 answers, not swallowed errors.
      - test-service
