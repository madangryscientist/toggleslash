version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - staticcheck
    - unconvert
    - unused
    - wastedassign
  # usestdlibvars is left out on purpose: in table tests it wants http.StatusOK for every status literal,
  # and a literal 429 next to the header that carries it is clearer than the constant.

formatters:
  enable:
    - gofmt
