# The rule set: RuboCop's default cops (the layout cops are the format check) with NewCops enabled, so a
# new RuboCop release is not silently weaker. Each cop turned off or loosened below says why.
AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

# The Python SDK reflows at 110; Ruby's blocks and keyword calls read better a little wider.
Layout/LineLength:
  Max: 120

# The SDK is a protocol client, a JSON reader, a pattern VM and an HTTP client: methods and classes are as long as
# their specification is. The size and complexity cops measure the spec, not the code's quality.
Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false

# A test says what it checks in its name and its assertions; a comment on every class would repeat it. The SDK's
# own classes keep the cop.
Style/Documentation:
  Exclude:
    - "test/**/*"
    - "test-service/**/*"

# Double quotes everywhere, the style of the whole tree (and of the Python SDK's formatter).
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Short parameter names (cp, lo, hi, io, ch) are the names the specification and the VM use.
Naming/MethodParameterName:
  MinNameLength: 1

# A few helpers do work and answer true or false (`add` follows jumps and reports MATCH; `send_usage` reports
# whether the flush may go on). A `?` suffix would promise a pure question.
Naming/PredicateMethod:
  Enabled: false

# Code point and byte ranges are written as the specification writes them, `lo <= x && x <= hi`.
Style/ComparableBetween:
  Enabled: false

# One test or service file holds a few small helper classes next to its subject.
Style/OneClassPerFile:
  Enabled: false

# `test_flag_1`-style names in tests spell the scenario number.
Naming/VariableNumber:
  CheckMethodNames: false

# The data rows of the SDK's shared constants are written out in full.
Metrics/BlockNesting:
  Max: 4
