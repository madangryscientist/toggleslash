[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toggleslash-sdk"
version = "0.0.0"
description = "The ToggleSlash server SDK for Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggleslash = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "test-service"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "RUF", "PL", "TRY"]
ignore = [
  "PLR0911", # many returns: the evaluator is a decision list
  "PLR0912",
  "PLR0913", # the client takes many options
  "PLR0915",
  "PLR0917", # an HTTP request takes a method, a target, headers and a body
  "PLR2004", # magic values: the spec's own numbers
  "TRY003",
  "TRY300",
  "TRY301",
  "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "B", "SIM", "RUF012", "RUF005"]
"test-service/*" = ["PLR"]
