[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toggleslash"
version = "0.0.0"
description = "A ToggleSlash server SDK for Python. Not published."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggleslash = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "test-service"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "PIE",
  "RET",
  "RUF",
  "PL",
  "S",
  "T20",
  "A",
  "N",
]
ignore = [
  "PLR0911", # a flat evaluator returns early on purpose
  "PLR0912",
  "PLR0913", # create_client takes the options the contract lists
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "RET505",
  "S101", # an assert narrows a type for the reader; none guards input
  "N818", # internal exception types are named for what they signal, not "Error"
  "SIM105", # try/except/pass says "ignore this OSError" at least as plainly as contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S310", "S603", "PLR", "SIM117", "T20", "N815"]
"test-service/**" = ["T20", "S104", "N815", "PLW0603"]
"src/toggleslash/_client.py" = ["S110"]
