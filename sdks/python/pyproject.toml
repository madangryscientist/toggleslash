[project]
name = "toggleslash"
version = "0.0.0"
description = "The ToggleSlash server SDK for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggleslash = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RET", "RUF", "A", "PERF", "PL", "T20"]
ignore = [
  # A class that is a parser, a dispatcher or a state machine has this many branches by design; the
  # evaluator mirrors the specification's own steps. PLR2004 would turn every protocol number (a status
  # code, a byte value, a limit from the contract) into a named constant used once.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  # The formatter wraps code; a long string or comment is left to the author.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build sockets on loopback, read private modules and bind to 127.0.0.1 deliberately.
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S311", "S603", "S607", "PLC0415", "PLW0603"]
# The test service prints the line the harness waits for and answers whatever a test asks.
"test-service/*" = ["T201", "S104"]
