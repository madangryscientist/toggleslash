[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "toggleslash"
version = "0.0.0"
description = "A ToggleSlash server SDK: local flag evaluation, a live ruleset and usage counts"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toggleslash = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "test-service"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PIE", "T20", "S"]
ignore = [
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLR0917",
  "S101",
  "S311",
  "S603",
  "S607",
  "S104",
  "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLC0415", "B017", "SIM117"]
"test-service/*" = ["E402"]
