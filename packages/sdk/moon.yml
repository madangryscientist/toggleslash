$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "engine"

tasks:
  typecheck:
    command: "tsc -p packages/sdk/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "oxlint --type-aware --deny-warnings packages/sdk && bun scripts/check-slop.ts packages/sdk"
    options:
      runFromWorkspaceRoot: true
