$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

tasks:
  typecheck:
    command: "tsc -p packages/sdk-conformance/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "oxlint --type-aware --deny-warnings packages/sdk-conformance && bun scripts/check-slop.ts packages/sdk-conformance"
    options:
      runFromWorkspaceRoot: true
