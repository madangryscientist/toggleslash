$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "sdk"

tasks:
  typecheck:
    command: "tsc -p packages/sdk-browser/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "oxlint --type-aware --deny-warnings packages/sdk-browser && bun scripts/check-slop.ts packages/sdk-browser"
    options:
      runFromWorkspaceRoot: true
