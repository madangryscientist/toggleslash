$schema: "../../.moon/cache/schemas/project.json"

tags: ["dotnet"]

# The four csproj files are built and tested here as one. dotnet restores and
# builds on its own, and its incremental build is its own cache, so `build` is never cached by moon.
# Every task that builds the server holds the `dotnet-server` mutex (here and in packages/e2e): two
# dotnet builds of the same projects at once race on the same obj/ and bin/ files and one fails.
tasks:
  build:
    script: "dotnet build ToggleSlash.Evaluation.Tests/ToggleSlash.Evaluation.Tests.csproj && dotnet build ToggleSlash.Server.Tests/ToggleSlash.Server.Tests.csproj"
    options:
      cache: false
      mutex: "dotnet-server"
  # `--blame` (sequence only) makes a crashed test host name the test that was running, in the output
  # and in TestResults/**/Sequence_*.xml (gitignored). No `--blame-crash`: a Linux crash dump is
  # hundreds of MB. `--blame-hang` kills a test host whose test has run for 5 minutes, names that test
  # and leaves a dump beside the sequence file, so a stall fails instead of holding the run until someone
  # kills it. A `mini` dump is still hundreds of MB, but it is written only on a hang. It holds thread
  # stacks and no heap: `dotnet-dump analyze <dump>`, then `clrstack -all`, shows a test blocked on a
  # thread (a lock, a sync wait, a loop); an `await` that never completes is on no thread, and finding
  # it needs `--blame-hang-dump-type full` and `dumpasync`.
  test:
    script: "dotnet test ToggleSlash.Evaluation.Tests/ToggleSlash.Evaluation.Tests.csproj --blame --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini && dotnet test ToggleSlash.Server.Tests/ToggleSlash.Server.Tests.csproj --blame --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini"
    inputs:
      - "**/*"
      - "/fixtures/**/*"
    options:
      mutex: "dotnet-server"
