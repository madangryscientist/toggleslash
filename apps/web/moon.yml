$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "engine"

# Their tools (tsr, vite, playwright) live in the app's own node_modules/.bin, which moon does not
# put on PATH, so `bun run` finds them from the app's directory.
tasks:
  typecheck:
    script: "bun run tsr generate && tsc --noEmit"
  lint:
    script: "oxlint --type-aware --deny-warnings apps/web && bun scripts/check-slop.ts apps/web"
    options:
      runFromWorkspaceRoot: true
  build:
    command: "bun run vite build"
    # A task's inputs replace the default project glob, so `**/*` is restated with the negations for what
    # a build writes. `$BUILD_COMMIT` is the commit the meta names: CI sets it to github.sha (ci.yml), so a
    # cache hit cannot serve another commit's dist/. A local `moon run web:build` (or the root `bun run build`)
    # does not set it, so it can still restore a dist/ built at an older commit; check the meta with
    # `(cd apps/web && bun run build)`, which skips moon.
    inputs:
      - "**/*"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/**/.wrangler/**"
      - "!/**/.tanstack/**"
      - "$BUILD_COMMIT"
    # The Cloudflare vite plugin writes .wrangler/deploy/config.json, which wrangler and vite preview
    # read, so a cache hit has to restore it with dist.
    outputs:
      - "dist"
      - ".wrangler/deploy"
  # Cached: its own project, the fake API's contract and CI (which sets forbidOnly); the packages and
  # the root files come from .moon/tasks. A task's inputs replace the default project glob, so `**/*`
  # is listed, and the negations are restated for what a run writes (its own build, its local state, the report).
  test-e2e:
    command: "bun run playwright test"
    inputs:
      - "**/*"
      - "!/**/node_modules/**"
      - "!/**/dist/**"
      - "!/**/.wrangler/**"
      - "!/**/.tanstack/**"
      - "!/**/test-results/**"
      - "!/**/playwright-report/**"
      # The fake API stands in for the server's API, so an API change re-runs it.
      - "/apps/server/openapi/*"
      - "$CI"
