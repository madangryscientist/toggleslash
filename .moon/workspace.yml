# moon workspace. A project id is its directory name, so `bunx moon run engine:test` runs the engine's
# tests. The four .NET projects (the .csproj files) are one moon project, `server`. Projects are listed, not globbed: nothing under `sdks/` is a project.
#
# No toolchain is declared (no .moon/toolchains.yml): every task runs on the `system` toolchain, so
# moon runs our bun commands as they are and never downloads Bun or runs `bun install`.
# The cache lives in .moon/cache (gitignored); moon has no setting to move it.
$schema: "./cache/schemas/workspace.json"

projects:
  example: "apps/example"
  site: "apps/site"
  web: "apps/web"
  server: "apps/server"
  cli: "packages/cli"
  e2e: "packages/e2e"
  engine: "packages/engine"
  sdk: "packages/sdk"
  sdk-browser: "packages/sdk-browser"
  sdk-conformance: "packages/sdk-conformance"
  sdk-openfeature: "packages/sdk-openfeature"
  sdk-otel: "packages/sdk-otel"
  scripts: "scripts"

vcs:
  client: "git"
  defaultBranch: "main"

pipeline:
  installDependencies: false

telemetry: false

# The shared remote cache: a bazel-remote store behind a token check, over HTTP. A task that main's CI
# already ran is then a "cached from remote" hit in a pull request or a fresh checkout.
# - Every request needs a token. MOON_REMOTE_TOKEN names the env var that holds it; unset, moon sends
#   none (set but empty is the same), every read is refused and the run is cold, as it was before.
# - Only ci.yml's gate on a push to main writes: it alone holds the write token. A pull request's
#   gate reads with the read token, and the cache refuses its uploads (moon logs a WARN and carries on).
# - Outside CI moon only downloads (localReadOnly), so a local run never uploads.
remote:
  api: "http"
  host: "https://moon-cache.madangryscientist.com"
  auth:
    token: "MOON_REMOTE_TOKEN"
  cache:
    localReadOnly: true
